[project]
name = "query-parser"
version = "0.1.0"
description = "Search query token tagger (author/category/format/other), built as an end-to-end MLOps practice project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
train = ["mlflow", "dvc[s3]"]
serve = ["fastapi", "uvicorn[standard]", "prometheus-client"]
monitor = ["evidently"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
